modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
[[mods]]
modId = "tracks"
version = "${mod_version}"
displayName = "${mod_name}"
logoFile = "icon.png"
credits = "Uses Trackwork art assets as placeholders. Special Thanks to original Create:Tracks author."
authors = "ChiyahaRe"
description = '''Fork of Addon for Create: Simulated Offroad that adds adjustable suspension keys and Sable-powered track blocks. More Create: Trackwork like features added.'''
[[mixins]]
config = "tracks.mixins.json"
[[dependencies.tracks]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version}"
ordering = "NONE"
side = "BOTH"
[[dependencies.tracks]]
