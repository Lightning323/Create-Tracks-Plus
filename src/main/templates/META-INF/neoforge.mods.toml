type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
[[dependencies.tracks]]
modId = "create"
type = "required"
versionRange = "[6.0.9,)"
ordering = "AFTER"
side = "BOTH"
[[dependencies.tracks]]
modId = "sable"
type = "required"
versionRange = "[1.0.3,)"
ordering = "AFTER"
side = "BOTH"
[[dependencies.tracks]]
